  short_description: "将选定 Stitch 屏幕实现为可维护、响应式且可验证的 React 界面"
  default_prompt: "使用 $stitch-ui-ux-codex:react-components 把选定 Stitch 屏幕实现到当前 React 项目并运行原生验证。"

dependencies:
  tools:
    - type: "mcp"
      value: "stitch"
      description: "Official Google Stitch Remote MCP"
      transport: "streamable_http"
      url: "https://stitch.googleapis.com/mcp"
