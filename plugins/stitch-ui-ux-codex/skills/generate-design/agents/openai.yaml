interface:
  display_name: "Generate Stitch Design"
  short_description: "通过官方 Stitch MCP 创建、编辑、评审并取回 UI 屏幕"
  default_prompt: "使用 $stitch-ui-ux-codex:generate-design 在指定 Stitch 项目中完成这个屏幕请求并验证结果。"

dependencies:
  tools:
    - type: "mcp"
      value: "stitch"
      description: "Official Google Stitch Remote MCP"
      transport: "streamable_http"
      url: "https://stitch.googleapis.com/mcp"
